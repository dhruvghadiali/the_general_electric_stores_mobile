name: the_general_electric_stores_mobile
description: "The General Electric Stores — Flutter mobile client for the-general-electric-stores-api."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # State management, routing and dependency injection
  get: ^4.7.2

  # Networking
  dio: ^5.7.0

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Config
  flutter_dotenv: ^5.2.1

  # Platform / device info
  connectivity_plus: ^6.1.0

  # UI
  cached_network_image: ^3.4.1

  # Scanning
  mobile_scanner: ^7.0.0
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
